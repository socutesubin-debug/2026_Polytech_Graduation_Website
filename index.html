<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BEYOND THE FRAME — 2026 시각디자인 졸업전시</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&family=Noto+Serif+KR:wght@300;400;500&display=swap">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/intro.css">
  <link rel="stylesheet" href="css/lobby.css">
  <link rel="stylesheet" href="css/gallery.css">
  <link rel="stylesheet" href="css/detail.css">
  <link rel="stylesheet" href="css/list.css">
  <link rel="stylesheet" href="css/test-room.css">
  <link rel="stylesheet" href="css/hall.css">
  <link rel="stylesheet" href="css/opening.css">
  <link rel="stylesheet" href="css/intro-scroll.css">
  <link rel="stylesheet" href="css/lobby3d.css">
  <link rel="stylesheet" href="css/about.css">
  <link rel="stylesheet" href="css/project.css">
  <link rel="stylesheet" href="css/designer.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<main id="app">

  <!-- ① 인트로: 티켓 → 길거리 포스터  (css/intro.css, js/intro.js) -->
  <section class="screen intro" id="intro" aria-label="인트로">
    <div class="cam" id="street-cam">
      <div class="stage" id="street-stage">
        <div class="tilt">
          <div class="layer" data-depth="1">
            <img class="plate" data-asset="street" alt="" style="width:1740px;height:980px">
            <div class="street-glow"></div>
            <button class="street-poster" id="poster" type="button" aria-label="2026 졸업전시 포스터. 눌러서 전시장으로 들어가기"><img data-asset="poster" alt=""></button>
          </div>
        </div>
      </div>
    </div>
    <button class="ticket" id="ticket" type="button" aria-label="티켓 뜯기"><img data-asset="ticket" alt="2026 시각디자인과 졸업전시 티켓"></button>
    <div class="torn-ticket" aria-hidden="true"><img data-asset="torn" alt=""></div>
    <button class="skip" type="button" data-skip>건너뛰기 →</button>
  </section>

  <!-- ② 인트로: 금색 액자 → 와장창  (css/intro.css, js/intro.js) -->
  <section class="screen intro-frame" id="intro-frame" aria-label="인트로">
    <div class="if-light"></div>
    <div class="if-floor"></div>
    <div class="if-frame" aria-hidden="true"><div class="if-orn"></div><div class="if-detail"></div></div>
    <div class="if-content">
      <div class="if-eyebrow">2026 GRADUATION PORTFOLIO</div>
      <h1 class="if-title"><span>프레임 너머</span><span>우리를 만나다</span></h1>
      <p class="if-sub">26년도 한국폴리텍대학 정수캠퍼스<br>시각디자인과 졸업작품 포트폴리오</p>
    </div>
    <div class="if-grain"></div>
  </section>

  <!-- ③ 로비: 액자 3개 = 전시실 입구  (css/lobby.css, js/lobby.js) -->
  <section class="screen" id="lobby" aria-label="로비">
    <div class="cam" id="lobby-cam">
      <div class="pearl" aria-hidden="true"></div>
      <div class="stage" id="lobby-stage">
        <div class="tilt">
          <div class="layer" data-depth=".55">
            <img class="plate" data-asset="arch" alt="" style="width:2000px;height:1128px">
            <div class="sun"></div>
            <div id="lobby-spots"></div>
          </div>
          <div class="layer" data-depth="1" id="lobby-front">
            <div id="windows"></div>
            <img class="plate" data-asset="frames" alt="" style="width:2000px;height:1128px">
            <div id="frame-btns"></div>
          </div>
        </div>
        <canvas class="dust"></canvas>
      </div>
    </div>
    <div class="screen-copy"><h2>세 개의 공간, 서로 다른 시선</h2></div>
  </section>

  <!-- ④ 전시실 GALLERY 01~03: 석고상  (css/gallery.css, js/gallery.js) -->
  <section class="screen" id="gallery" aria-label="전시실">
    <div class="cam" id="gallery-cam">
      <div class="pearl" aria-hidden="true"></div>
      <div class="stage" id="gallery-stage" data-room="0">
        <div class="tilt">
          <div class="layer tint" data-depth="1" id="gallery-back">
            <img class="plate" id="room-bg" alt="" style="width:2000px;height:1126px">
            <div id="gallery-spots"></div>
          </div>
          <div class="layer tint" data-depth="1">
            <img class="plate" id="room-statues" alt="" style="width:2000px">
            <div id="shadows"></div>
          </div>
        </div>

        <div class="tilt"><div class="layer" data-depth="1" id="hots"></div></div>
        <canvas class="dust"></canvas>
      </div>
    </div>
    <div class="screen-copy"><h2 id="g-title">GALLERY 01</h2></div>
    <button class="room-arrow prev" id="room-prev" type="button" aria-label="이전 전시실">←</button>
    <button class="room-arrow next" id="room-next" type="button" aria-label="다음 전시실">→</button>
  </section>

  <!-- ⑤ 학생 목록 LIST — 스토리보드 s8  (css/list.css, js/list.js) — 주소 끝 #list -->
  <section class="screen list" id="list" aria-label="학생 목록">
    <div class="list-inner">
      <h2>LIST</h2>
      <div class="tools">
        <label class="search-box" for="search">
          <span class="sr">학생 이름 검색</span>
          <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M13 13l4.5 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <input class="search" id="search" type="search" placeholder="학생 이름 검색" autocomplete="off">
        </label>
        <div class="field-filter" id="field-filter" role="group" aria-label="분야 선택">
          <button type="button" data-field="all" aria-pressed="true">전체</button>
          <button type="button" data-field="uxui" aria-pressed="false">UX/UI</button>
          <button type="button" data-field="visual" aria-pressed="false">Visual</button>
        </div>
        <span class="total" id="total" aria-live="polite"></span>
      </div>
      <div class="grid" id="grid"></div>
      <p class="empty-msg" id="empty" hidden>찾는 이름이 없어요. 이름을 다시 확인해 주세요.</p>
    </div>
  </section>

  <!-- ⑥ 시험 방: 기둥 1개 + 석고상 3개, 스크롤로 나비 비행  (css/test-room.css, js/test-room.js) — 주소 끝 #test-room -->
  <section class="screen test-room" id="test-room" aria-label="시험 방" tabindex="-1">
    <div class="tr-track" id="tr-track">
      <div class="tr-view" id="tr-view">
        <div class="tr-tags" id="tr-tags"></div>
        <div class="tr-hud">
          <p class="tr-title">TEST ROOM <span>시험 방</span></p>
          <p class="tr-hint">스크롤을 내리면 앞으로, 올리면 뒤로 날아가요</p>
          <div class="tr-steps">
            <button type="button" id="tr-prev" aria-label="이전 지점으로">↑ 이전</button>
            <button type="button" id="tr-next" aria-label="다음 지점으로">다음 ↓</button>
          </div>
          <div class="tr-bar" aria-hidden="true"><i id="tr-progress"></i></div>
        </div>
        <div class="tr-fail" id="tr-fail" role="alert" hidden>
          <p>3D 전시실을 불러오지 못했어요.</p>
          <div>
            <button type="button" id="tr-to-list">전체 학생 보기</button>
            <button type="button" id="tr-retry">다시 시도</button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- ⑦ V2 전시관: UX/UI · Visual. 안쪽 내용은 js/hall.js가 채움 (css/hall.css) — 주소 끝 #hall-uxui, #hall-visual -->
  <section class="screen test-room hall" id="hall-uxui" aria-label="UX/UI · 웹 전시관" tabindex="-1"></section>
  <section class="screen test-room hall" id="hall-visual" aria-label="Visual 전시관" tabindex="-1"></section>

  <!-- ⑧ Intro — 스크롤 인트로: 하늘의 나비 → 포스터 벽 → 나비가 포스터 속으로(표면이 물처럼 일렁임) → 하얗게 → About
       (css/opening.css · css/intro-scroll.css, js/opening.js · js/intro-scroll.js · js/butterfly-gl.js) — 인트로만 따로 보기: intro-proto.html -->
  <section class="screen opening" id="opening" aria-label="인트로">
    <div class="op-track"><div class="op-stage" id="op-stage" aria-hidden="true"></div></div>
    <button class="op-skip" id="op-skip" type="button">건너뛰기 →</button>
  </section>

  <!-- ⑨ V2 로비 — 스토리보드 s5: 아치 3개 중 방 고르기  (css/lobby3d.css, js/lobby3d.js) — 주소 끝 #lobby3d
       3D 아치는 js/lobby3d.js가 그림. 아래 버튼 3개는 키보드·모바일·3D 실패 때도 똑같이 쓰는 입구 -->
  <section class="screen lobby3d" id="lobby3d" aria-label="로비">
    <div class="lb-view" id="lb-view"></div>
    <div class="lb-copy"><p>LOBBY</p><h2>어느 방으로 날아갈까요?</h2></div>
    <div class="lb-doors" id="lb-doors">
      <button class="lb-door" type="button" data-door="0" data-go="hall-uxui"><i aria-hidden="true"></i><small>GALLERY 01</small><b>UX/UI의 방</b><span id="lb-count-0"></span></button>
      <button class="lb-door" type="button" data-door="1" data-go="hall-visual"><i aria-hidden="true"></i><small>GALLERY 02</small><b>비주얼의 방</b><span id="lb-count-1"></span></button>
      <button class="lb-door" type="button" data-door="2" data-go="special"><i aria-hidden="true"></i><small>GALLERY 03</small><b>갤러리</b><span id="lb-count-2"></span></button>
    </div>
    <button class="lb-all" id="lb-all" type="button">전체 학생 바로가기 →</button>
  </section>

  <!-- ⑫ About — 전시 소개: 왼쪽 포스터, 오른쪽 서문·개요  (css/about.css, js/about.js) — 주소 끝 #about. 글은 js/data.js의 ABOUT -->
  <section class="screen about" id="about" aria-label="About: 전시 소개" tabindex="-1">
    <div class="ab-wrap">
      <figure class="ab-poster"><img id="ab-poster" alt="전시 포스터" decoding="async"></figure>
      <div class="ab-copy">
        <p class="ab-eyebrow">ABOUT</p>
        <h2 id="ab-title"></h2>
        <p class="ab-sub" id="ab-sub"></p>
        <div class="ab-text" id="ab-text"></div>
        <dl class="ab-info" id="ab-info"></dl>
        <div class="ab-go">
          <button type="button" data-to="project">작품 보러 가기</button>
          <button type="button" data-to="designer">디자이너 만나기</button>
        </div>
      </div>
    </div>
  </section>

  <!-- ⑩ Project 방 — 작품 15개: 떠다니는 카드(공 → 도넛) → 작품 상세  (css/project.css, js/project.js) — 주소 끝 #project
       떠다니는 카드(pj-cloud 안), 상세 그림(pj-d-images 안)은 js/project.js가 js/data.js를 보고 만듦 -->
  <section class="screen project" id="project" aria-label="Project: 작품" tabindex="-1">
    <div class="pj-track" id="pj-track">
    <div class="pj-hero" id="pj-hero">
      <div class="pj-scene" aria-hidden="true"><div class="pj-space" id="pj-space"><div class="pj-cloud" id="pj-cloud"></div></div></div>
      <!-- 화면에는 작품 썸네일만. 아래 한 줄은 화면 읽기 프로그램용 (눈에는 안 보임) -->
      <p class="pj-live" id="pj-live" aria-live="polite"></p>
    </div>
    </div>
    <!-- 작품 상세: 왼쪽 = 제목 · 이름 · 설명 · (맨 아래) 메일, 오른쪽 = 내려 보는 그림들, 오른쪽 위 X = 닫기 -->
    <div class="pj-detail" id="pj-detail" role="dialog" aria-modal="true" aria-labelledby="pj-d-title" hidden>
      <aside class="pj-d-side">
        <h2 id="pj-d-title"></h2>
        <button type="button" class="pj-d-who" id="pj-d-who"></button>
        <p class="pj-d-desc" id="pj-d-desc"></p>
        <a class="pj-d-mail" id="pj-d-mail" hidden></a>
      </aside>
      <div class="pj-d-images" id="pj-d-images"></div>
      <button type="button" class="pj-d-close" id="pj-d-close" aria-label="닫기"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l16 16M20 4L4 20"/></svg></button>
    </div>
  </section>

  <!-- ⑪ Designer — 어두운 전시실: 가운데 화살표 팻말에서 왼쪽 = UX/UI · 웹, 오른쪽 = Visual (벽 빛의 색이 다르고, 팻말 뒤에서 흐릿하게 섞임). 석고상 + 작품안내 표찰(누르면 포트폴리오)  (css/designer.css, js/designer.js) — 주소 끝 #designer
       석고상·표찰(dg-row 안)은 js/designer.js가 js/data.js를 보고 만듦 -->
  <section class="screen designer" id="designer" aria-label="Designer: 디자이너" tabindex="-1">
    <!-- 어두운 전시실의 빛나는 벽 두 장: 팻말 왼쪽 = UX/UI · 웹 벽, 오른쪽 = Visual 벽. 팻말 뒤(dg-seam)에서 흐릿하게 섞임 -->
    <div class="dg-amb ux" id="dg-amb-ux" aria-hidden="true"><i class="dg-wall"></i><i class="dg-glow"></i></div>
    <div class="dg-amb vi" id="dg-amb-vi" aria-hidden="true"><i class="dg-wall"></i><i class="dg-glow"></i></div>
    <div class="dg-seam" aria-hidden="true"></div>
    <ul class="dg-row" id="dg-row" aria-label="디자이너 석고상 (옆으로 넘겨 보세요)"></ul>
    <button type="button" class="dg-arrow prev" id="dg-prev" aria-label="왼쪽 석고상">←</button>
    <button type="button" class="dg-arrow next" id="dg-next" aria-label="오른쪽 석고상">→</button>
    <div class="dg-track" aria-hidden="true"><i id="dg-bar"></i></div>
  </section>

  <!-- 공통: 상단 메뉴, 안내 문구, 화면 전환 효과  (css/common.css, js/screens.js) -->
  <nav class="topbar" id="topbar" aria-label="전시 메뉴">
    <button class="brand" id="brand" type="button" title="오프닝 다시 보기">BEYOND THE FRAME</button>
    <div class="pill">
      <button type="button" data-go="opening">Intro</button>
      <button type="button" data-go="about">About</button>
      <button type="button" data-go="project">Project</button>
      <button type="button" data-go="designer">Designer</button>
    </div>
  </nav>
  <div class="toast" id="toast" role="status"></div>
  <div class="veil" id="veil"></div>
  <div class="shards" id="shards" aria-hidden="true"></div>
  <div class="portal" id="portal" aria-hidden="true"></div>
  <!-- 공통 학생 상세 팝업  (css/detail.css, js/detail.js) -->
  <div class="detail" id="detail" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="d-name">
      <button class="d-close" id="d-close" type="button" aria-label="닫기">×</button>
      <button class="d-nav prev" id="d-prev" type="button" aria-label="이전 학생">←</button>
      <button class="d-nav next" id="d-next" type="button" aria-label="다음 학생">→</button>
      <div class="d-stage">
        <div class="d-model" id="d-model"></div>
      </div>
      <div class="d-card">
        <div class="d-top"><span id="d-room"></span><span id="d-count"></span></div>
        <h3 id="d-name"></h3>
        <div class="d-slogan" id="d-slogan"></div>
        <p id="d-desc"></p>
        <a class="portfolio" id="d-portfolio" target="_blank" rel="noopener">포트폴리오 열기 ↗</a>
      </div>
    </div>
</main>

<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/screens.js"></script>
<script src="js/models3d.js"></script>
<script src="js/intro.js"></script>
<script src="js/lobby.js"></script>
<script src="js/gallery.js"></script>
<script src="js/detail.js"></script>
<script src="js/list.js"></script>
<!-- 스크롤과 비행 연결: GSAP ScrollTrigger (인터넷이 끊겨도 test-room.js가 직접 계산해서 동작) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
<script src="js/test-room.js"></script>
<script src="js/hall.js"></script>
<script src="js/butterfly-gl.js"></script>
<script src="js/intro-scroll.js"></script>
<script src="js/opening.js"></script>
<script src="js/lobby3d.js"></script>
<script src="js/about.js"></script>
<script src="js/project.js"></script>
<script src="js/designer.js"></script>
<script src="js/main.js"></script>
</body>
</html>
