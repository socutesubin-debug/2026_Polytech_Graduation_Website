<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#140e09">
<title>BEYOND THE FRAME — AR 나비</title>
<meta name="description" content="2026 한국폴리텍 서울정수캠퍼스 시각디자인과 졸업전시 BEYOND THE FRAME. 내 주위를 날아다니는 금빛 AR 나비.">
<!-- 포스터 QR로 들어오는 폰 전용 AR 나비 페이지 (2026-11-16)
     - 열자마자 뒤 카메라가 켜지고, 그 위에 금빛 나비(js/butterfly-gl.js)가 내 주위 공간을 날아다님 (AR 계산: js/butterfly-ar.js, 숫자는 그 파일 맨 위 BF_AR)
     - 화면 아래 버튼은 '웹사이트 구경하기' 하나뿐 (전시 웹사이트 index.html로 감)
     - 나비는 카메라가 보는 쪽을 따라오고, 손바닥을 내밀면 손 위에 앉음 (손 알아보기: js/butterfly-hand.js). 움직일 때 별빛 반짝이
     - 화면을 톡 치면 나비가 가까이 옴. 아이폰은 이 첫 톡에서 '동작 센서' 허락을 물어봄 (아이폰 규칙상 누르기 전에는 물을 수 없음)
     - 카메라를 거절하거나 없으면: 어두운 배경 위에서 같은 나비 (화면을 끌어서 둘러보기)
     - 3D(WebGL2)가 안 되는 폰: 메인 포스터 그림
     - 카메라는 https 주소에서만 켜져서, http 주소로 들어오면 바로 아래 PAGE_HTTPS 주소로 옮겨 감 -->
<style>
  :root { --ink: #f1e6d2; --gold: #e7c98f; --bg: #140e09; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  .bg { position: fixed; inset: 0; background:
      radial-gradient(120% 70% at 50% 108%, rgba(214,160,92,.30), rgba(214,160,92,0) 60%),
      linear-gradient(#0d0906, #1a120b 55%, #24180e); }
  #cam { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: transparent; opacity: 0; transition: opacity .6s; }
  body.cam-on #cam { opacity: 1; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  .arrow { position: fixed; left: -18px; top: -18px; width: 36px; height: 36px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .arrow.on { opacity: 1; }
  .arrow::before { content: ""; position: absolute; inset: 6px; background: #f3dcab; clip-path: polygon(100% 50%, 0 0, 25% 50%, 0 100%);
    filter: drop-shadow(0 0 6px rgba(243,220,171,.9)); }
  .tip { position: fixed; left: 16px; right: 16px; top: calc(20px + env(safe-area-inset-top)); margin: 0; text-align: center; font-size: 13px; line-height: 1.6;
    color: #fff; text-shadow: 0 1px 6px rgba(0,0,0,.7); pointer-events: none; transition: opacity .8s; }
  .tip.off { opacity: 0; }
  /* 유리 느낌 버튼 (글래스모피즘): 뒤 배경이 흐리게 비치고, 가장자리에 밝은 선 */
  .go { position: fixed; left: 50%; bottom: calc(26px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    padding: 15px 30px; border-radius: 999px; white-space: nowrap; color: #fff; text-decoration: none; font-size: 15px; font-weight: 600; letter-spacing: .02em;
    background: linear-gradient(135deg, rgba(255,255,255,.30), rgba(255,255,255,.10));
    -webkit-backdrop-filter: blur(16px) saturate(160%); backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid rgba(255,255,255,.45);
    box-shadow: 0 8px 32px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(255,255,255,.12);
    text-shadow: 0 1px 4px rgba(0,0,0,.45); }
  .go:active { background: linear-gradient(135deg, rgba(255,255,255,.42), rgba(255,255,255,.18)); }
  .go:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
  /* 3D가 안 될 때: 포스터 그림 */
  .fallback { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; padding: 40px 28px 110px; }
  .fallback img { max-width: 100%; max-height: 100%; border-radius: 4px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
  body.no-gl canvas, body.no-gl .tip, body.no-gl #cam { display: none; }
  body.no-gl .fallback { display: flex; }
</style>
<script>
  /* 카메라는 https에서만 켜져요. http(닷홈 기본 주소)로 들어오면 https 주소로 바로 옮겨 감. 닷홈에 SSL을 켜면 아래 주소를 같은 페이지의 https 주소로 바꾸면 돼요 */
  var PAGE_HTTPS = 'https://socutesubin-debug.github.io/2026_Polytech_Graduation_Website/butterfly.html';
  if (location.protocol === 'http:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) location.replace(PAGE_HTTPS);
</script>
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<video id="cam" playsinline muted autoplay aria-hidden="true"></video>
<div class="fallback"><img src="assets/images/intro-webgl/main-poster.webp" alt="BEYOND THE FRAME 졸업전시 메인 포스터"></div>
<canvas id="bf" role="img" aria-label="내 주위를 날아다니는 금빛 나비. 화면을 톡 치면 가까이 와요"></canvas>
<div class="arrow" id="arrow" aria-hidden="true"></div>
<p class="tip" id="tip">폰을 들고 주위를 둘러보세요 · 톡 치면 나비가 가까이 와요</p>
<a class="go" href="./">웹사이트 구경하기</a>

<script src="js/butterfly-gl.js?v=20261117b"></script>
<script src="js/butterfly-ar.js?v=20261117f"></script>
<script src="js/butterfly-hand.js?v=20261117f"></script>
<script>
(() => {
  const cv = document.getElementById('bf'), video = document.getElementById('cam'), tip = document.getElementById('tip');
  let GL = null, ar = null;
  try { GL = window.createButterflyGL ? createButterflyGL(cv, { sky: true, dense: 1, maxDpr: 2 }) : null; } catch (e) { GL = null; }
  if (!GL) { document.body.classList.add('no-gl'); return; }
  cv.addEventListener('webglcontextlost', (e) => { e.preventDefault(); document.body.classList.add('no-gl'); if (ar) ar.stop(); });

  /* 1) 나비는 바로 날기 시작 */
  ar = startButterflyAR({ GL, root: cv, video, canvas: cv, arrow: document.getElementById('arrow') });

  window.__bfAR = { ar, hand: false }; // 검사용
  /* 2) 카메라 바로 켜기 (허락 창이 뜸). 거절·실패하면 어두운 배경 그대로 */
  if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
    navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } })
      .then((stream) => { video.srcObject = stream; return video.play().catch(() => {}); })
      .then(() => { if (video.srcObject && !video.paused) document.body.classList.add('cam-on'); })
      .then(() => /[?&]hand=0/.test(location.search) ? Promise.reject() : startButterflyHand(video, BF_AR.fov, (h) => ar.setHand(h))) // 손 알아보기 (큰 파일이라 카메라가 켜진 뒤에 받음)
      .then(() => { window.__bfAR.hand = true; tip.textContent = '손바닥을 내밀면 나비가 앉아요'; tip.classList.remove('off'); setTimeout(() => tip.classList.add('off'), 7000); })
      .catch(() => {});
  }

  /* 3) 아이폰: 동작 센서는 '누르기' 안에서만 허락을 물을 수 있음 → 첫 톡에서 물어봄 */
  const needAsk = window.DeviceOrientationEvent && typeof DeviceOrientationEvent.requestPermission === 'function';
  setTimeout(() => { if (needAsk && !ar.hasSensor) tip.textContent = '화면을 한 번 톡 치면 나비가 공간에 머물러요'; }, 1000); // 아이폰: 아직 센서 허락 전
  cv.addEventListener('pointerdown', function first() {
    cv.removeEventListener('pointerdown', first);
    if (needAsk) DeviceOrientationEvent.requestPermission().catch(() => {}).then(() => { tip.textContent = '폰을 들고 주위를 둘러보세요'; });
    if (video.srcObject && video.paused) video.play().then(() => document.body.classList.add('cam-on')).catch(() => {});
  });
  /* 센서가 없는 기기(PC 등): 끌어서 둘러보기 안내 */
  setTimeout(() => { if (!ar.hasSensor && !needAsk) tip.textContent = '화면을 끌어서 둘러보세요 · 톡 치면 나비가 가까이 와요'; }, 1500);
  setTimeout(() => tip.classList.add('off'), 10000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && video.srcObject) video.play().catch(() => {}); });
})();
</script>
</body>
</html>
