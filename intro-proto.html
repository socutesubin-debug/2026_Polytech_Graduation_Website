<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond the Frame · 인트로 시험</title>
<style>
  :root { --ink: #5f4a30; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body { height: 700vh; font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: #cfe0f0; }
  .layer { position: absolute; inset: 0; }
  #s1 { background: url("assets/images/intro/s1-sky.jpg") center / cover no-repeat; }
  /* scene 3: a tunnel of tilted frames leading to a bright doorway */
  #s3 { opacity: 0; background: #fff; perspective: 900px; perspective-origin: 50% 46%; overflow: hidden; }
  #tun { position: absolute; left: 50%; top: 46%; width: 0; height: 0; transform-style: preserve-3d; }
  .fr { position: absolute; left: 0; top: 0; width: 0; height: 0; transform-style: preserve-3d; will-change: transform; }
  .fr div, .floor { position: absolute; }
  #door { position: absolute; background: #fff; box-shadow: 0 0 120px 80px #fff; }
  /* butterfly */
  #fx { position: absolute; inset: 0; pointer-events: none; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .ring { position: absolute; border: 1px solid rgba(150,118,70,.6); pointer-events: none; }
  #white { background: #fff; opacity: 0; }
  #title { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; color: var(--ink); text-align: center; letter-spacing: .32em; }
  #title b { display: block; font-weight: 300; font-size: clamp(22px, 4.2vw, 56px); }
  #title span { display: block; margin-top: 18px; font-size: clamp(11px, 1.2vw, 15px); letter-spacing: .2em; }
  #hint { position: absolute; left: 0; right: 0; bottom: 28px; text-align: center; color: #fff; font-size: 12px; letter-spacing: .4em; text-shadow: 0 1px 6px rgba(60,90,130,.5); }
  #hint i { display: block; width: 1px; height: 34px; margin: 10px auto 0; background: #fff; animation: drop 1.6s ease-in-out infinite; transform-origin: top; }
  @keyframes drop { 0% { transform: scaleY(0); } 60% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }
</style>
</head>
<body>
<div id="stage">
  <div id="s1" class="layer"></div>
  <div id="s3" class="layer"><div id="tun"><div id="door"></div></div></div>
  <div id="fx" class="layer"></div>
  <canvas id="gl"></canvas>
  <div id="white" class="layer"></div>
  <div id="title"><div><b>BEYOND THE FRAME</b><span>프레임 너머, 우리를 만나다</span></div></div>
  <div id="hint">SCROLL<i></i></div>
</div>

<script src="js/butterfly-gl.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var s1 = $('s1'), s3 = $('s3'), tun = $('tun'), door = $('door'), glc = $('gl'),
      white = $('white'), title = $('title'), hint = $('hint'), fx = $('fx');
  // knobs
  var CFG = {
    size: .105,        // butterfly size (share of the shorter screen side)
    dense: 1,          // 0 = see-through glass wings, 1 = nearly solid
    dust: .08,         // how much gold dust (1 = a lot)
    frames: 9, gap: 300, first: 280, thick: 110   // tunnel: number of frames, distance between them, distance to the first
  };
  var GL = window.createButterflyGL ? createButterflyGL(glc, { sky: true, dense: CFG.dense }) : null, glB = GL && GL.butterflies[0], lastX = null;
  var W = innerWidth, H = innerHeight;

  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function seg(p, a, b) { return clamp((p - a) / (b - a)); }
  function ease(u) { return u * u * (3 - 2 * u); }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function hex(a, b, u) { return 'rgb(' + [0, 1, 2].map(function (i) { return Math.round(lerp(a[i], b[i], u)); }).join(',') + ')'; }

  // ---- tunnel (after the 3D draft): thick slab frames that twist step by step, a grey floor, a bright door at the end ----
  // each frame = a wall with a rectangular opening + the four inner faces of the opening (so it has thickness)
  var frames = [], floors = [];
  var WALL = [[232, 234, 231], [206, 216, 226], [222, 222, 215]];                 // near white, light blue-grey, warm grey
  var FACE = { l: [78, 80, 88], t: [128, 138, 150], r: [186, 200, 214], b: [150, 150, 150] };
  for (var i = 0; i < CFG.frames; i++) {
    var g = document.createElement('div'); g.className = 'fr'; tun.appendChild(g);
    var f = { el: g, i: i, z: CFG.first + i * CFG.gap, tilt: -13 + i * 3.4, ox: (i % 3 - 1) * .02 * (i ? 1 : 0), oy: -.01 * i, parts: {} };
    ['wall', 'l', 'r', 't', 'b'].forEach(function (k) { var d = document.createElement('div'); g.appendChild(d); f.parts[k] = d; });
    frames.push(f);
  }
  var endZ = CFG.first + CFG.frames * CFG.gap + 500;
  // floor strips never cut through a wall (a plane crossing the walls breaks the 3D sorting)
  for (var i = 0; i <= CFG.frames; i += CFG.frames) {   // only the strip in front of the entrance and the one in the end hall; in between, the frames' own bottom faces read as the floor
    var fd = document.createElement('div'); fd.className = 'floor'; tun.appendChild(fd);
    floors.push({ el: fd, z0: i === 0 ? -900 : CFG.first + (i - 1) * CFG.gap + 1, z1: i === CFG.frames ? endZ : CFG.first + i * CFG.gap - 1 });
  }
  function layout() {
    W = innerWidth; H = innerHeight;
    var u = Math.min(W, H), S = Math.max(W, H) * 5, ow = .62 * u, oh = .8 * u, d = CFG.thick;
    frames.forEach(function (f) {
      var far = f.i / (CFG.frames - 1), lite = .25 * far, w = ow, h = oh;
      var x0 = S / 2 - w / 2, x1 = S / 2 + w / 2, y0 = S / 2 - h / 2, y1 = S / 2 + h / 2, e = f.parts.wall.style;
      e.width = e.height = S + 'px'; e.left = e.top = -S / 2 + 'px';
      e.clipPath = 'polygon(evenodd, 0 0, ' + S + 'px 0, ' + S + 'px ' + S + 'px, 0 ' + S + 'px, 0 0, ' + x0 + 'px ' + y0 + 'px, ' + x1 + 'px ' + y0 + 'px, ' + x1 + 'px ' + y1 + 'px, ' + x0 + 'px ' + y1 + 'px, ' + x0 + 'px ' + y0 + 'px)';
      e.background = hex(WALL[f.i % 3], [246, 246, 244], lite);   // flat colours only: huge gradient layers break on some GPUs
      // inner faces: boxes of depth d going back from the opening's edges
      var P = f.parts;
      P.l.style.cssText = 'left:' + (-w / 2) + 'px;top:' + (-h / 2) + 'px;width:' + d + 'px;height:' + h + 'px;transform-origin:0 50%;transform:rotateY(90deg);background:' + hex(FACE.l, [200, 200, 204], lite);
      P.r.style.cssText = 'left:' + (w / 2 - d) + 'px;top:' + (-h / 2) + 'px;width:' + d + 'px;height:' + h + 'px;transform-origin:100% 50%;transform:rotateY(-90deg);background:' + hex(FACE.r, [236, 240, 244], lite);
      P.t.style.cssText = 'left:' + (-w / 2) + 'px;top:' + (-h / 2) + 'px;width:' + w + 'px;height:' + d + 'px;transform-origin:50% 0;transform:rotateX(-90deg);background:' + hex(FACE.t, [222, 226, 232], lite);
      P.b.style.cssText = 'left:' + (-w / 2) + 'px;top:' + (h / 2 - d) + 'px;width:' + w + 'px;height:' + d + 'px;transform-origin:50% 100%;transform:rotateX(90deg);background:' + hex(FACE.b, [214, 214, 214], lite);
      f.px = f.ox * u; f.py = f.oy * u;
    });
    floors.forEach(function (fl, i) {
      var len = fl.z1 - fl.z0, g = i ? 228 : 150;
      fl.el.style.cssText = 'left:' + (-S / 2) + 'px;top:' + (oh * .47 - len) + 'px;width:' + S + 'px;height:' + len + 'px;transform-origin:50% 100%;background:rgb(' + g + ',' + g + ',' + g + ')';
    });
    door.style.width = ow * .5 + 'px'; door.style.height = oh * .86 + 'px'; door.style.left = -ow * .25 + 'px'; door.style.top = (oh * .47 - oh * .86) + 'px';
  }
  addEventListener('resize', layout); layout();

  var target = 0, p = 0;
  function readScroll() { var m = document.documentElement.scrollHeight - innerHeight; target = m > 0 ? clamp(scrollY / m) : 0; }
  addEventListener('scroll', readScroll, { passive: true }); readScroll();
  var Q = new URLSearchParams(location.search);
  var fixed = Q.get('p');                      // ?p=0.6 freezes the scene at one point (for checking)

  var last = performance.now(), lastRing = 0, t0 = last, RAD = Math.PI / 180;
  function spawnRing(x, y, sc) {
    var d = document.createElement('i'); d.className = 'ring';
    var w = 60 * sc, h = 82 * sc; d.style.width = w + 'px'; d.style.height = h + 'px'; d.style.left = x - w / 2 + 'px'; d.style.top = y - h / 2 + 'px';
    fx.appendChild(d);
    d.animate([{ transform: 'scale(.7) rotate(-4deg)', opacity: 0 }, { opacity: .6, offset: .25 }, { transform: 'scale(2.1) rotate(5deg)', opacity: 0 }], { duration: 1500, easing: 'ease-out' }).onfinish = function () { d.remove(); };
  }

  function frame(now) {
    var dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
    var t = (now - t0) / 1000;
    if (fixed !== null) { p = +fixed; } else { p += (target - p) * Math.min(1, dt * 6); }
    var u = Math.min(W, H), sc = u / 900;

    // ---- timing (p = scroll progress 0..1) ----
    var kSide = ease(seg(p, .06, .15));        // S1: turn from the front view to a side view
    var kFly = ease(seg(p, .10, .30));         // S1: fly off to the right, seen from the side
    var kCut = seg(p, .30, .34);               // cut S1 -> S3
    var kIn  = ease(seg(p, .34, .50));         // S3: enter from the left (side view) to the middle of the doorway
    var kAway = ease(seg(p, .43, .53));        // turn away from us, towards the tunnel
    var kGo = seg(p, .52, .90);                // fly through the tunnel, camera right behind
    var kWhite = ease(seg(p, .80, .90));
    var kTitle = ease(seg(p, .92, .99));

    s3.style.opacity = kCut;
    s1.style.visibility = kCut >= 1 ? 'hidden' : 'visible';

    // tunnel camera
    var cam = Math.pow(kGo, 2.1) * (endZ + 500);
    for (var i = 0; i < frames.length; i++) {
      var f = frames[i], z = cam - f.z;       // 0 = at the screen plane, 900 = at the eye
      if (z > 820) { f.el.style.display = 'none'; continue; }
      f.el.style.display = '';
      f.el.style.transform = 'translate3d(' + f.px + 'px,' + f.py + 'px,' + z + 'px) rotateZ(' + f.tilt + 'deg)';
    }
    for (var i = 0; i < floors.length; i++) { var fl = floors[i], vis = cam - fl.z1 < 820; fl.el.style.display = vis ? '' : 'none'; if (vis) fl.el.style.transform = 'translateZ(' + (cam - fl.z0) + 'px) rotateX(90deg)'; }
    door.style.transform = 'translateZ(' + (cam - endZ) + 'px)';

    // ---- butterfly path ----
    var bob = Math.sin(t * 2.1) * 9 * sc + Math.sin(t * 3.7) * 4 * sc, sway = Math.sin(t * 1.3) * 12 * sc;
    var x, y, pitch, roll, yaw, scale = 1;
    if (p < .32) {                       // scene 1
      x = lerp(.5 * W, 1.18 * W, kFly) + sway * (1 - kFly);
      y = .44 * H - Math.sin(kFly * Math.PI) * .07 * H + bob;
      pitch = lerp(-36, -74, kSide); roll = lerp(6 * Math.sin(t * .9), -90, kSide);   // roll -90 = head to the right
      yaw = lerp(10 * Math.sin(t * .5), 0, kSide);
    } else {                             // scene 3
      x = lerp(-.14 * W, .5 * W, kIn) + sway * .5 * (1 - kGo);
      y = lerp(.46 * H, .55 * H, kIn) + bob;
      pitch = lerp(-74, -70, kAway); roll = lerp(-90, 0, kAway) + 7 * Math.sin(t * 1.7) * kAway; yaw = 5 * Math.sin(t * 1.1) * kAway;
      scale = lerp(1, .8, kAway) * (1 - .55 * ease(seg(p, .74, .88)));
    }
    var hidden = (p > .305 && p < .34) || p > .9;
    var alpha = hidden ? 0 : 1 - seg(p, .84, .9);
    if (GL) {
      var wpos = GL.toWorld(x, y), k = GL.unitsPerPx();
      if (lastX !== null && Math.abs(x - lastX) > .5 * W) GL.clearDust();   // scene cut: drop the old dust
      lastX = x;
      glB.pose = { x: wpos[0], y: wpos[1], z: 0, scale: CFG.size * u * scale * k, yaw: yaw * RAD, pitch: pitch * RAD, roll: roll * RAD };
      glB.hzMul = 1 + .9 * Math.max(Math.sin(kFly * Math.PI), Math.sin(kIn * Math.PI), kGo > 0 ? .8 : 0);
      glB.dust = alpha > .5 ? CFG.dust : 0;
      GL.wind[2] = 5 * Math.pow(kGo, 1.4);          // dust rushes past us while we fly through
      glc.style.opacity = alpha;
      GL.simulate(dt); GL.draw();
    }
    // a thin frame outline ripples out now and then while it hovers
    if (alpha > .5 && p < .08 && now - lastRing > 2600) { spawnRing(x, y, sc); lastRing = now; }

    white.style.opacity = kWhite;
    title.style.opacity = kTitle;
    hint.style.opacity = 1 - seg(p, .01, .06);
    if (!manual) requestAnimationFrame(frame);
  }
  // ?rec=1: frames are stepped by hand (for recording): __tick(p) advances 1/30 s
  var manual = Q.get('rec') === '1', clock = performance.now();
  if (manual) window.__tick = function (v) { fixed = v; clock += 1000 / 30; frame(clock); };
  else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
