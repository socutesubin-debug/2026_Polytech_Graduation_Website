<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond the Frame · 인트로 시험</title>
<style>
  :root { --ink: #5f4a30; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  body { height: 700vh; font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  #stage { position: fixed; inset: 0; overflow: hidden; background: #cfe0f0; }
  .layer { position: absolute; inset: 0; }
  #s1 { background: url("assets/images/intro/s1-sky.jpg") center / cover no-repeat; }
  /* scene 2: sky + ground behind, and the poster wall as one flat plane we can turn */
  #s2 { opacity: 0; background: linear-gradient(to bottom, #a9c6e3 0%, #e4edf5 60%, #d9d2c7 60%, #c9c1b6 100%); }
  #cam { position: absolute; inset: 0; perspective: 1400px; perspective-origin: 50% 50%; }
  #wall { position: absolute; left: -400vw; top: -100vh; width: 650vw; height: 300vh; background: #d2c9c2; transform-origin: 450vw 150vh; transform-style: preserve-3d; }
  #wall .img, #wall .tile { position: absolute; left: 400vw; top: 100vh; width: 100vw; height: 100vh;
          background: url("assets/images/intro/s2-poster-wall.jpg") center / cover no-repeat; }
  /* the same photo mirrored outwards, so the stone and the leaf shadows carry on past the edge of the screen (only the strips next to the seam, which have no poster in them) */
  #wall .tile.l { left: 300vw; transform: scaleX(-1); clip-path: inset(0 64% 0 0); }
  #wall .tile.r { left: 500vw; transform: scaleX(-1); clip-path: inset(0 0 0 64%); }
  #wall .tile.t { top: 0; transform: scaleY(-1); clip-path: inset(0 0 86% 0); }
  #wall .tile.b { top: 200vh; transform: scaleY(-1); clip-path: inset(86% 0 0 0); }
  /* the poster again as its own layer, a little in front of the wall: real depth when the camera moves */
  #poster { position: absolute; overflow: hidden; background: url("assets/images/intro/s2-poster-wall.jpg") no-repeat; transform: translateZ(26px);
          box-shadow: 0 1.4vmin 3.2vmin rgba(70,50,28,.38), 0 .3vmin .8vmin rgba(70,50,28,.3); }
  /* effects on the poster's own surface (they turn with the wall): inner glow + soft ripples where the butterfly goes in */
  #pfx, #rfx { position: absolute; width: 0; height: 0; }
  #pfx { transform: translateZ(28px); }
  #pfx i, #rfx i { position: absolute; border-radius: 50%; pointer-events: none; opacity: 0; will-change: transform, opacity; }
  #pfx .pglow { left: -19vmin; top: -19vmin; width: 38vmin; height: 38vmin; background: radial-gradient(circle, rgba(255,255,255,1) 0, rgba(255,244,214,.85) 22%, rgba(255,226,170,.35) 48%, rgba(255,226,170,0) 70%); }
  /* a ripple = a wide soft band of light with a faint shadow behind it, like a wave on glass; clipped to the poster */
  #rfx .rip { left: -20vmin; top: -20vmin; width: 40vmin; height: 40vmin; mix-blend-mode: soft-light;
          background: radial-gradient(circle, rgba(255,255,255,0) 40%, rgba(120,84,40,.22) 50%, rgba(255,255,255,.95) 60%, rgba(255,246,222,.5) 67%, rgba(255,255,255,0) 76%); }
  /* light that bursts out at the spot where it enters (screen space) */
  #flash { position: absolute; left: 0; top: 0; width: 0; height: 0; pointer-events: none; opacity: 0; }
  #flash i { position: absolute; left: -22vmin; top: -22vmin; width: 44vmin; height: 44vmin; border-radius: 50%;
          background: radial-gradient(circle, #fff 0, rgba(255,250,235,.95) 12%, rgba(255,232,180,.5) 34%, rgba(255,232,180,0) 68%); }
  /* butterfly */
  #fx { position: absolute; inset: 0; pointer-events: none; }
  #gl { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  .ring { position: absolute; border: 1px solid rgba(150,118,70,.6); pointer-events: none; }
  #white { background: #fff; opacity: 0; }
  #hint { position: absolute; left: 0; right: 0; bottom: 28px; text-align: center; color: #fff; font-size: 12px; letter-spacing: .4em; text-shadow: 0 1px 6px rgba(60,90,130,.5); }
  #hint i { display: block; width: 1px; height: 34px; margin: 10px auto 0; background: #fff; animation: drop 1.6s ease-in-out infinite; transform-origin: top; }
  @keyframes drop { 0% { transform: scaleY(0); } 60% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }
</style>
</head>
<body>
<div id="stage">
  <div id="s1" class="layer"></div>
  <div id="s2" class="layer"><div id="cam"><div id="wall"><div class="tile l"></div><div class="tile r"></div><div class="tile t"></div><div class="tile b"></div><div class="img"></div><div id="poster"><div id="rfx"><i class="rip"></i><i class="rip"></i><i class="rip"></i></div></div><div id="pfx"><i class="pglow"></i></div></div></div></div>
  <div id="fx" class="layer"></div>
  <canvas id="gl"></canvas>
  <div id="flash"><i></i></div>
  <div id="white" class="layer"></div>
  <div id="hint">SCROLL<i></i></div>
</div>

<script src="js/butterfly-gl.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var s1 = $('s1'), s2 = $('s2'), wall = $('wall'), glc = $('gl'), flash = $('flash'),
      pglow = document.querySelector('#pfx .pglow'), rips = document.querySelectorAll('#rfx .rip'), poster = $('poster'), pfx = $('pfx'), rfx = $('rfx'),
      white = $('white'), hint = $('hint'), fx = $('fx');
  // knobs
  var CFG = {
    size: .105,        // butterfly size (share of the shorter screen side)
    dense: 1,          // 0 = see-through glass wings, 1 = nearly solid
    dust: .08,         // how much gold dust (1 = a lot)
    orbit: 20,         // how far the camera drifts to the side while the butterfly waits (degrees; keep small, the wall is one flat photo)
    zoom: 3.4          // how far the camera pushes into the poster after the butterfly
  };
  var GL = window.createButterflyGL ? createButterflyGL(glc, { sky: true, dense: CFG.dense }) : null, glB = GL && GL.butterflies[0], lastX = null;
  var W = innerWidth, H = innerHeight;

  function clamp(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function seg(p, a, b) { return clamp((p - a) / (b - a)); }
  function ease(u) { return u * u * (3 - 2 * u); }
  function lerp(a, b, u) { return a + (b - a) * u; }
  function hex(a, b, u) { return 'rgb(' + [0, 1, 2].map(function (i) { return Math.round(lerp(a[i], b[i], u)); }).join(',') + ')'; }

  // where the poster sits inside the photo (px in the 1672 x 941 image), so its own layer and the effects line up at any screen shape
  var IMG = { w: 1672, h: 941, x0: 606, x1: 1066, y0: 148, y1: 794 };
  function layout() {
    W = innerWidth; H = innerHeight;
    var k = Math.max(W / IMG.w, H / IMG.h), ox = (W - IMG.w * k) / 2, oy = (H - IMG.h * k) / 2;       // same maths as background: center / cover
    var px = ox + IMG.x0 * k, py = oy + IMG.y0 * k, pw = (IMG.x1 - IMG.x0) * k, ph = (IMG.y1 - IMG.y0) * k;
    var L = 4 * W, T = H;                                                                              // the photo's corner inside #wall
    poster.style.left = L + px + 'px'; poster.style.top = T + py + 'px'; poster.style.width = pw + 'px'; poster.style.height = ph + 'px';
    poster.style.backgroundSize = IMG.w * k + 'px ' + IMG.h * k + 'px'; poster.style.backgroundPosition = (ox - px) + 'px ' + (oy - py) + 'px';
    CX = px + pw / 2; CY = py + ph * .47;                                                              // the poster's butterfly
    pfx.style.left = L + CX + 'px'; pfx.style.top = T + CY + 'px'; rfx.style.left = pw / 2 + 'px'; rfx.style.top = ph * .47 + 'px';
    wall.style.transformOrigin = (L + CX) + 'px ' + (T + CY) + 'px';
  }
  var CX = 0, CY = 0;
  addEventListener('resize', layout); layout();

  var target = 0, p = 0;
  function readScroll() { var m = document.documentElement.scrollHeight - innerHeight; target = m > 0 ? clamp(scrollY / m) : 0; }
  addEventListener('scroll', readScroll, { passive: true }); readScroll();
  var Q = new URLSearchParams(location.search);
  var fixed = Q.get('p');                      // ?p=0.6 freezes the scene at one point (for checking)

  var last = performance.now(), lastRing = 0, t0 = last, RAD = Math.PI / 180;
  function spawnRing(x, y, sc) {
    var d = document.createElement('i'); d.className = 'ring';
    var w = 60 * sc, h = 82 * sc; d.style.width = w + 'px'; d.style.height = h + 'px'; d.style.left = x - w / 2 + 'px'; d.style.top = y - h / 2 + 'px';
    fx.appendChild(d);
    d.animate([{ transform: 'scale(.7) rotate(-4deg)', opacity: 0 }, { opacity: .6, offset: .25 }, { transform: 'scale(2.1) rotate(5deg)', opacity: 0 }], { duration: 1500, easing: 'ease-out' }).onfinish = function () { d.remove(); };
  }

  function frame(now) {
    var dt = Math.min(.05, Math.max(0, (now - last) / 1000)); last = now;
    var t = (now - t0) / 1000;
    if (fixed !== null) { p = +fixed; } else { p += (target - p) * Math.min(1, dt * 6); }
    var u = Math.min(W, H), sc = u / 900;

    // ---- timing (p = scroll progress 0..1) ----
    var kSide = ease(seg(p, .06, .15));        // S1: turn from the front view to a side view
    var kFly = ease(seg(p, .10, .28));         // S1: fly off to the right, seen from the side
    var kCut = seg(p, .28, .32);               // cut S1 -> S2
    var kIn  = ease(seg(p, .32, .46));         // S2: enter from the left (side view), reach the poster
    var kFace = ease(seg(p, .40, .47));        // turn to face the poster
    var kOrb = ease(seg(p, .47, .64));         // camera walks round to the side
    var kDive = seg(p, .69, .765); kDive = kDive * kDive;   // the butterfly darts into the poster
    var kThru = Math.pow(seg(p, .70, .93), 2.6); // camera drifts right with the dive, then speeds up through the wall once it is in
    var kWhite = ease(seg(p, .80, .89));

    s2.style.opacity = kCut;
    s1.style.visibility = kCut >= 1 ? 'hidden' : 'visible';

    // wall plane: turn it and slide it, as if the camera walked round to the right and then through
    var theta = CFG.orbit * kOrb * (1 - ease(seg(p, .70, .86)));   // drift a little to the side, then square up as we go in
    var wallX = lerp(0, .05 * W, kOrb) * (1 - ease(seg(p, .70, .86)));   // px offset of the poster on screen
    var zoom = 1 + (CFG.zoom - 1) * kThru;                           // push in towards the poster's butterfly
    wall.style.transform = 'translateX(' + wallX + 'px) rotateY(' + (-theta) + 'deg) scale(' + zoom + ')';

    // the moment of entering: the poster glows from inside as the butterfly comes close, then ripples spread on its surface
    var near = ease(seg(p, .66, .765)), after = seg(p, .765, .90);
    pglow.style.opacity = near * (1 - .55 * ease(after));
    pglow.style.transform = 'scale(' + (.5 + .7 * near + 1.6 * after) + ')';
    for (var r = 0; r < rips.length; r++) {
      var e = seg(p, .764 + r * .03, .875 + r * .03);
      rips[r].style.opacity = e > 0 && e < 1 ? Math.sin(Math.PI * Math.pow(e, .6)) * .9 : 0;     // swells in, then dies away
      rips[r].style.transform = 'scale(' + (.15 + 2.9 * (1 - Math.pow(1 - e, 2))) + ')';
    }
    poster.style.transform = 'translateZ(26px) scale(' + (1 + .012 * Math.sin(Math.PI * seg(p, .76, .82))) + ')';   // the poster gives a tiny pulse as it takes the butterfly in

    // ---- butterfly path ----
    var bob = Math.sin(t * 2.1) * 9 * sc + Math.sin(t * 3.7) * 4 * sc, sway = Math.sin(t * 1.3) * 12 * sc;
    var x, y, pitch, roll, yaw, scale = 1;
    var th = 0;
    if (p < .30) {                       // scene 1
      x = lerp(.5 * W, 1.18 * W, kFly) + sway * (1 - kFly);
      y = .44 * H - Math.sin(kFly * Math.PI) * .07 * H + bob;
      pitch = lerp(-36, -74, kSide); roll = lerp(6 * Math.sin(t * .9), -90, kSide);   // roll -90 = head to the right
      yaw = lerp(10 * Math.sin(t * .5), 0, kSide);
    } else {                             // scene 2
      var posterX = CX + wallX; th = theta * RAD;
      // it waits a little in front of the poster (nearer to us = lower left and bigger), then flies away from us into it
      var frontX = posterX - .09 * W * (1 - kDive);
      x = lerp(-.14 * W, frontX, kIn) + sway * .5 * (1 - kDive);
      y = lerp(.40 * H, lerp(CY + .12 * H, CY, kDive), kIn) + bob * (1 - kDive);
      pitch = lerp(-74, -62, kFace); roll = lerp(-90, lerp(-16, 0, kDive), kFace);   // side flight, then nose towards the poster
      yaw = -theta;                                          // it turns with the wall, so from the side we see it in profile
      scale = lerp(1, 1.35, kIn) * (1 - .84 * kDive);
      // burst of light exactly where it goes in
      var fl = seg(p, .745, .775) * (1 - seg(p, .775, .86));
      flash.style.opacity = fl;
      flash.style.transform = 'translate(' + posterX + 'px,' + CY + 'px) scale(' + ((.5 + 1.6 * seg(p, .745, .86))) + ',' + (.5 + 1.6 * seg(p, .745, .86)) + ')';
    }
    if (p < .3) flash.style.opacity = 0;
    var hidden = (p > .285 && p < .32) || p > .79;
    var alpha = hidden ? 0 : 1 - seg(p, .757, .775);
    if (GL) {
      var wpos = GL.toWorld(x, y), k = GL.unitsPerPx();
      if (lastX !== null && Math.abs(x - lastX) > .5 * W) GL.clearDust();   // scene cut: drop the old dust
      lastX = x;
      glB.pose = { x: wpos[0], y: wpos[1], z: 0, scale: CFG.size * u * scale * k, yaw: yaw * RAD, pitch: pitch * RAD, roll: roll * RAD };
      glB.hzMul = 1 + .9 * Math.max(Math.sin(kFly * Math.PI), Math.sin(kIn * Math.PI), 1.4 * kDive);
      glB.dust = alpha > .5 ? CFG.dust * (1 + 9 * kDive) : 0;      // it sheds a trail of dust as it darts in
      GL.wind[0] = p > .32 ? 1.1 * seg(p, .70, .76) * (1 - seg(p, .765, .78)) * Math.sin(th) : 0;   // the dust is drawn into the poster after it
      GL.wind[2] = p > .32 ? -1.1 * seg(p, .70, .76) * (1 - seg(p, .765, .78)) * Math.cos(th) : 0;
      glc.style.opacity = alpha;
      GL.simulate(dt); GL.draw();
    }
    // a thin frame outline ripples out now and then while it hovers
    if (alpha > .5 && p < .08 && now - lastRing > 2600) { spawnRing(x, y, sc); lastRing = now; }

    white.style.opacity = kWhite;
    hint.style.opacity = 1 - seg(p, .01, .06);
    if (!manual) requestAnimationFrame(frame);
  }
  // ?rec=1: frames are stepped by hand (for recording): __tick(p) advances 1/30 s
  var manual = Q.get('rec') === '1', clock = performance.now();
  if (manual) window.__tick = function (v) { fixed = v; clock += 1000 / 30; frame(clock); };
  else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
