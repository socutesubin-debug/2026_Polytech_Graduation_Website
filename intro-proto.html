<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond the Frame · 인트로 시험</title>
<link rel="stylesheet" href="css/intro-scroll.css">
<style>
  html, body { margin: 0; background: #fff; }
  body { height: 700vh; }
  #stage { position: fixed; inset: 0; }
</style>
</head>
<body>
<div id="stage"></div>
<script src="js/butterfly-gl.js"></script>
<script src="js/intro-scroll.js"></script>
<script>
/* 인트로만 따로 보는 시험 페이지. 실제 사이트(index.html)도 같은 js/intro-scroll.js를 씁니다.  ?p=0.6 한 지점에서 멈춤 · ?rec=1 녹화용(__tick) */
var Q = new URLSearchParams(location.search);
var I = createIntroScroll(document.getElementById('stage'), { p: Q.has('p') ? +Q.get('p') : null, rec: Q.get('rec') === '1' });
if (Q.get('rec') === '1') window.__tick = I.tick; else I.start();
</script>
</body>
</html>
